<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifica Materia</title>
    <link rel="icon" href="/images/icons8-punta-della-matita-32.png" type="image/png" sizes="40x40">
    <style>
        body {
            background-color: #f0f0f0;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 90%;
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #333;
        }

        .form-label {
            font-size: 20px;
            color: #333;
            text-align: left;
            display: block;
            margin-bottom: 5px;
        }

        .form-control {
            font-size: 18px;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #d1dbe1;
            margin-bottom: 10px;
            width: 100%;
        }

        .form-control:focus {
            border-color: #D32F2F;
            box-shadow: 0 0 5px rgba(211, 47, 47, 0.5);
        }

        .form-control.is-invalid {
            border-color: #dc3545;
            box-shadow: 0 0 5px rgba(220, 53, 69, 0.5);
        }

        .error {
            color: red;
            font-size: 16px;
            display: block;
            text-align: left;
            margin-bottom: 10px;
        }

        .btn {
            background-color: #D32F2F;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            margin: 10px;
            display: inline-block;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #B22222;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            font-size: 18px;
            border-radius: 8px;
            text-align: center;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Modifica Materia</h1>

        <!-- Messaggio di errore generale -->
        <div th:if="${errorMessages}" class="alert alert-danger" role="alert">
            <ul>
                <li th:each="error : ${errorMessages}" th:text="${error}"></li>
            </ul>
        </div>

        <!-- Messaggio di conferma -->
        <div th:if="${messaggio}" class="alert alert-success" role="alert">
            <p th:text="${messaggio}"></p>
        </div>

        <form th:action="@{/admin/salvaModificaMateria/{id}(id=${materia.id})}" th:object="${materia}" method="post">
            
            <!-- Campo Nome -->
            <div class="form-group">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" id="nome" th:field="*{nome}" 
                       class="form-control" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"  />
                <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error"></span>
            </div>

            <!-- Campo Tipo -->
            <div class="form-group">
                <label for="tipo" class="form-label">Tipo:</label>
                <input type="text" id="tipo" th:field="*{tipo}" 
                       class="form-control" th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid' : ''"  />
                <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}" class="error"></span>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary">Salva Modifiche</button>
                <a th:href="@{/admin/modificaMateria}" class="btn btn-secondary">Annulla</a>
            </div>

            <div class="text-center mt-4">
                <a href="/admin/operazioniMaterie" class="btn btn-primary">Torna al Menu</a>
            </div>
        </form>
    </div>
</body>
</html>
