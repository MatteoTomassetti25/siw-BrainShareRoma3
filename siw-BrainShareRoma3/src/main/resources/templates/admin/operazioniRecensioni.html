<!DOCTYPE html>
<html>

<head>
    <title>Gestione Recensioni</title>
	<link rel="icon" href="/images/icons8-punta-della-matita-32.png" type="image/png" sizes="40x40">
    <style>
        body {
            background-color: #f0f0f0; /* Grigio chiaro */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Contenitore principale */
        .container {
            background-color: #ffffff;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        /* NAVBAR dentro il container */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #D32F2F; /* Rosso */
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        /* Pulsanti Navbar */
        .nav-button {
            background-color: #B22222; /* Rosso scuro */
            color: white;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
        }

        .nav-button:hover {
            background-color: #8B0000; /* Rosso più scuro */
        }

        /* Sezione Login/Logout */
        .auth-buttons {
            display: flex;
            align-items: center;
        }

        .auth-buttons span {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin-right: 15px;
        }

        /* Titolo */
        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            color: #333;
        }

        /* Layout per i bottoni */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .button-container a {
            background-color: #D32F2F; /* Rosso */
            color: white;
            padding: 18px 35px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 18px;
            display: inline-block;
            width: 45%;
            max-width: 350px;
            font-weight: bold;
            text-align: center;
            transition: background 0.3s ease;
        }

        .button-container a:hover {
            background-color: #B22222; /* Rosso scuro */
        }

        /* Logo */
        .container img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 40px auto;
            display: block;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="container">
        
        <!-- NAVBAR all'interno del container -->
        <div class="navbar">
            <a href="/" class="nav-button">Home</a>
            <div class="auth-buttons">
                <div th:if="${userDetails}">
                    <span th:text="${userDetails.username}"></span>
                    <a href="/logout" class="nav-button">Logout</a>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a href="/login" class="nav-button">Login</a>
                </div>
            </div>
        </div>

        <img src="/images/logo1.png" width="10%" />

        <h1>Gestione Recensioni</h1>

        <div class="button-container">
            <a href="/admin/listaAppuntiRecensione">Elenco recensioni per appunto</a>
        </div>

    </div>

</body>

</html>
