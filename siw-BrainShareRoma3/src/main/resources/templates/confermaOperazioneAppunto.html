<!DOCTYPE html>
<html lang="it">
	<link rel="icon" href="/images/icons8-punta-della-matita-32.png" type="image/png" sizes="40x40">
	<style>
	        body {
	            background-color: #f0f4f8; /* Grigio chiaro di fallback */
	            background-image: url("https://www.uniroma3.it/assets/img/uniroma3_logo.png"); /* Immagine di sfondo */
	            background-size: cover; /* Copre tutta la pagina */
	            background-position: center; /* Centra l'immagine */
	            display: flex;
	            flex-direction: column; /* Allinea gli elementi verticalmente */
	            justify-content: center;
	            align-items: center;
	            min-height: 100vh;
	            margin: 0;
	            font-family: Arial, sans-serif;
	            padding: 20px;
	        }

	        .container {
	            background-color: #ffffff;
	            padding: 40px; /* Padding aumentato */
	            border-radius: 20px; /* Bordi stondati */
	            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
	            max-width: 600px; /* Larghezza massima */
	            width: 90%; /* Larghezza relativa per adattarsi meglio */
	            text-align: center;
	        }

	        h1 {
	            font-size: 36px; /* Font più grande */
	            color: #333;
	            margin-bottom: 20px;
	        }

	        .btn {
	            background-color: #5d8a98; /* Blu chiaro */
	            color: white;
	            padding: 15px 30px; /* Più grande per il pulsante */
	            border-radius: 12px; /* Bordi più stondati */
	            font-size: 18px; /* Font più grande per il pulsante */
	            text-decoration: none;
	            display: inline-block;
	            margin-top: 20px;
	        }

	        .btn:hover {
	            background-color: #4a6a73; /* Blu scuro al hover */
	        }
	    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferma Operazione</title>
</head>
<body>
    <h1>Operazione riuscita!</h1>
	
	<div class="text-center mt-4">
	            <a href="/" class="btn btn-primary">Torna al Menu</a>
	        </div>
</body>
</html>
