<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Appunti</title>
    <link rel="icon" href="/images/icons8-punta-della-matita-32.png" type="image/png" sizes="40x40">
    <style>
        body {
            background-color: #f0f4f8; /* Grigio chiaro di fallback */
            background-size: cover; /* Fa in modo che l'immagine copra tutta la pagina */
            background-position: center; /* Centra l'immagine */
            display: flex;
            flex-direction: column; /* Allinea gli elementi verticalmente */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 50px; /* Padding aumentato */
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 1200px; /* Larghezza massima aumentata */
            width: 90%; /* Larghezza relativa per adattarsi meglio */
            text-align: center;
            margin-bottom: 30px; /* Margine inferiore per separare dal pulsante */
        }

        h1 {
            font-size: 32px; /* Font più grande */
            margin-bottom: 30px; /* Margine aumentato */
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto 30px auto; /* Centra la tabella orizzontalmente */
        }

        th, td {
            padding: 15px;
            text-align: center; /* Allinea il testo al centro */
            border-bottom: 1px solid #d1dbe1; /* Blu chiaro */
        }

        th {
            background-color: #5d8a98; /* Blu chiaro */
            color: white;
            font-size: 18px;
        }

        td {
            font-size: 16px;
        }

        .btn {
            background-color: #5d8a98; /* Blu chiaro */
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            margin: 5px;
            display: inline-block;
        }

        .btn:hover {
            background-color: #4a6a73; /* Blu scuro al hover */
        }

        .btn-warning {
            background-color: #ffc107; /* Colore giallo per il pulsante Recensisci */
            color: #333;
        }

        .btn-warning:hover {
            background-color: #e0a800; /* Giallo scuro al hover */
        }

        .text-center {
            text-align: center;
        }

        .mt-4 {
            margin-top: 20px;
        }

        /* Stile per il messaggio di errore */
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            font-size: 18px;
            border-radius: 8px;
            text-align: center;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Lista Appunti</h1>

        <!-- Messaggio di errore -->
        <div th:if="${messaggioErrore}" class="alert alert-danger" role="alert">
            <p th:text="${messaggioErrore}"></p>
        </div>

        <table class="table table-striped mt-4">
            <thead class="table-dark">
                <tr>
                    <th>Nome Appunto</th>
                    <th>Materia</th>
                    <th>Voto Medio</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="appunto : ${appunti}">
                    <td th:text="${appunto.nome}"></td>
                    <td th:text="${appunto.materia.nome}"></td>
                    <td th:text="${appunto.getVoto()}"></td>
                    <td>
                        <a th:href="@{/appunti/{id}(id=${appunto.id})}" class="btn btn-primary">Visualizza</a>
                        <a th:href="@{/formNewRecensione/{id}(id=${appunto.id})}" class="btn btn-warning">Recensisci</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-4">
        <a href="/" class="btn btn-primary">Torna al Menu</a>
    </div>
</body>
</html>
